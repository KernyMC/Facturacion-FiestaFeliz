server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Nota: en nginx, si un "location" define sus propias cabeceras, no hereda las del servidor.
  # Por eso las cabeceras de seguridad se repiten en cada bloque con este include.

  # La app y el service worker nunca se guardan en caché del navegador: así siempre llega la última versión
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/seguridad.inc;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    include /etc/nginx/conf.d/seguridad.inc;
  }
  location = /version.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/seguridad.inc;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/seguridad.inc;
  }
  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/conf.d/seguridad.inc;
  }
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/conf.d/seguridad.inc;
  }
}
